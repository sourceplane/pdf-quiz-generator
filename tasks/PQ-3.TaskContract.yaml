apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: PQ-3
  title: "pdf-quiz-generator becomes an Orun baseline"
spec:
  goal: blueprint.yaml and repo-blueprint.yaml take a new PDF quiz app from nothing to live on stage and prod in one landing, held by Baseline CI
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - apps/web/docs
    - tests/web/docs
    - specs/epics/pdf-quiz-generator
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - an app placed from it carries the app only, branded, with the template's links, Google's variable name and the Workers AI binding intact
  gates: []
